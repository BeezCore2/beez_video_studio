# Builds the Windows app and its installers.
#
# * Push a version tag to publish a GitHub Release:
#     git tag v0.2.0 && git push origin v0.2.0
#   The tag must be "v" + the version in Cargo.toml.
# * Or start it by hand (Actions → Release → Run workflow) to get the files as a build
#   artifact without publishing anything.
#
# Release assets:
#   * Beez-Video-Studio-Setup-vX.Y.Z-Standalone.exe — installer with FFmpeg included.
#   * Beez-Video-Studio-Setup-vX.Y.Z.exe — small installer; the app downloads FFmpeg.
#   * Beez-Video-Studio-vX.Y.Z-x86_64-pc-windows-msvc.zip — the portable app. Its name
#     contains the target triple and it holds `beez_video_studio.exe`, which is what the
#     in-app updater (src/updater.rs) downloads. Installer names must NOT contain the triple.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package portable zip
        shell: pwsh
        run: |
          # The updater picks the zip whose name contains its own target triple.
          $zip = "Beez-Video-Studio-v$env:VERSION-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path target/release/beez_video_studio.exe -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build small installer
        shell: pwsh
        run: |
          # No installer/ffmpeg folder yet: the app downloads FFmpeg on first start.
          & $env:ISCC "/DAppVersion=$env:VERSION" installer/beezvideo.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          "SETUP=dist/Beez-Video-Studio-Setup-v$env:VERSION.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          for ($i = 1; $i -le 3; $i++) {
            try { Invoke-WebRequest $url -OutFile ffmpeg.zip; break }
            catch { if ($i -eq 3) { throw }; Start-Sleep -Seconds 15 }
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          New-Item -ItemType Directory -Force installer/ffmpeg | Out-Null
          Get-ChildItem ffmpeg-unpacked -Recurse -Include ffmpeg.exe, ffprobe.exe |
            Where-Object { $_.Directory.Name -eq "bin" } |
            Copy-Item -Destination installer/ffmpeg
          if (-not (Test-Path installer/ffmpeg/ffmpeg.exe) -or -not (Test-Path installer/ffmpeg/ffprobe.exe)) {
            throw "ffmpeg.exe / ffprobe.exe not found in the download"
          }
          & installer/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Build standalone installer
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=$env:VERSION" installer/beezvideo.iss
          if ($LASTEXITCODE -ne 0) { throw "Standalone installer build failed" }
          "SETUP_FULL=dist/Beez-Video-Studio-Setup-v$env:VERSION-Standalone.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beez-video-studio-${{ env.VERSION }}
          path: |
            ${{ env.SETUP_FULL }}
            ${{ env.SETUP }}
            ${{ env.ZIP }}
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @($env:SETUP_FULL, $env:SETUP, $env:ZIP)
          # Re-running a tag replaces the files of the existing release.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "Upload failed" }
            return
          }
          $notes = @"
          ## Download

          - **New install:** ``Beez-Video-Studio-Setup-v$env:VERSION-Standalone.exe`` includes FFmpeg and works offline. The smaller ``Beez-Video-Studio-Setup-v$env:VERSION.exe`` downloads FFmpeg on first start. No administrator rights are needed.
          - **Portable:** download the ``.zip``, extract it and run ``beez_video_studio.exe``.
          - **Already installed?** The app updates itself: open it and click **Update now**.

          "@
          gh release create $tag @files --title "Beez Video Studio $tag" --notes "$notes" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Release failed" }

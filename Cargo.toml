[package]
name = "beez_video_studio"
version = "0.1.0"
edition = "2024"
description = "Beez Video Studio: compress, convert, trim and edit videos on your own PC"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", features = ["glow"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.18.0"
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "github", "archive-zip", "compression-zip-deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
